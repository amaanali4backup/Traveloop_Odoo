<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .trip-card {
            padding: 1.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .trip-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .trip-card-image {
            height: 150px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">
            <i data-lucide="plane-takeoff"></i> Traveloop
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html" class="active">My Profile</a>
            <a href="create_trip.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">New Trip</a>
        </div>
    </nav>

    <main class="page-content container animate-fade-in">
        <div class="profile-header">
            <div class="avatar">JR</div>
            <div>
                <h2>Welcome Back, Jordan!</h2>
                <p style="color: var(--text-muted);">Manage your upcoming itineraries and past adventures.</p>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h3>Your Journeys</h3>
            <span id="trip-count" style="color: var(--text-muted);">0 Trips</span>
        </div>

        <div class="trips-grid" id="trips-grid">
            <!-- Rendered via JS -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        async function loadProfile() {
            const tripsGrid = document.getElementById('trips-grid');
            tripsGrid.innerHTML = '<p style="padding:2rem;">Loading...</p>';
            
            const trips = await DAL.getTripsFromDB();
            document.getElementById('trip-count').innerText = `${trips.length} Trips`;

            if(trips.length === 0) {
                tripsGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem;" class="glass">
                        <i data-lucide="compass" style="width: 48px; height: 48px; opacity: 0.5; margin-bottom: 1rem;"></i>
                        <h4>No trips planned yet</h4>
                        <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 1.5rem;">Time to start dreaming and building your next adventure.</p>
                        <a href="create_trip.html" class="btn btn-primary">Plan a Trip</a>
                    </div>
                `;
            } else {
                tripsGrid.innerHTML = trips.map(trip => {
                    // API returns stops_count, we mock the bgImage for now
                    const bgImage = 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400';

                    return `
                        <div class="trip-card glass" onclick="viewTrip('${trip.trip_id}')">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <h4 style="margin: 0; line-height: 1.3;">${trip.name}</h4>
                                <span style="background: rgba(255,107,53,0.2); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;">$${trip.total_budget ? trip.total_budget.toLocaleString() : 0}</span>
                            </div>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">${trip.stops_count} Destinations</p>
                            <p style="color: var(--text-muted); font-size: 0.7rem; margin-top: 0.2rem;">${new Date(trip.start_date).toLocaleDateString()}</p>
                            <div class="trip-card-image" style="background-image: url('${bgImage}')"></div>
                        </div>
                    `;
                }).join('');
            }
            lucide.createIcons();

            window.viewTrip = (id) => {
                // In a real app we'd fetch the specific trip details by ID here.
                // For this demo, we'll just redirect to the builder blank or load placeholder via DAL
                alert("This would fetch Trip ID " + id + " from the API and render the itinerary.");
            };
        }

        loadProfile();
    </script>
</body>
</html>
