<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop | Your Itinerary</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .itinerary-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .timeline-grid { grid-template-columns: 1fr; }
            .budget-panel { order: -1; }
        }

        /* Journey Nodes Horizontal */
        .journey-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 3rem 0 4rem;
            position: relative;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        .journey-line::before {
            content: '';
            position: absolute;
            top: 24px; left: 0; right: 0;
            height: 2px;
            background: var(--glass-border);
            z-index: 1;
        }

        .journey-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            min-width: 100px;
        }

        .node-dot {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 4px solid var(--bg-dark);
            box-shadow: 0 0 0 2px var(--primary);
            margin-bottom: 0.5rem;
        }

        .budget-panel {
            position: sticky;
            top: 100px;
        }
    </style>
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">
            <i data-lucide="plane-takeoff"></i> Traveloop
        </a>
        <div class="nav-links">
            <a href="profile.html">My Profile</a>
        </div>
    </nav>

    <main class="page-content container animate-fade-in">
        <div class="itinerary-header">
            <h1 id="display-name" class="gradient-text">Your Journey</h1>
            <p id="display-desc" style="color: var(--text-muted); font-size: 1.2rem;"></p>
        </div>

        <div class="glass panel" style="padding: 2rem; margin-bottom: 3rem;">
            <h3>Visual Timeline</h3>
            <div class="journey-line" id="journey-line"></div>
        </div>

        <div class="timeline-grid">
            <div class="details-panel glass" style="padding: 2rem;">
                <h3>Detailed Route</h3>
                <div id="route-details" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 2rem;"></div>
            </div>

            <div class="budget-panel glass" style="padding: 2rem; height: fit-content;">
                <h3>Estimated Cost</h3>
                <h2 id="total-budget" style="color: var(--primary); font-size: 3rem; margin: 1rem 0;">$0</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Calculation includes average daily expenses per city based on the duration of stay, plus a base flat rate flight estimate.</p>
                <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                    <button class="btn btn-primary btn-block" onclick="saveToProfile()">Save Journey</button>
                    <a href="create_trip.html" class="btn btn-outline btn-block">Edit Itinerary</a>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        let activeTrip = null;
        let isViewMode = false;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const tripId = urlParams.get('id');

            if (tripId) {
                isViewMode = true;
                activeTrip = await DAL.getTripById(tripId);
                if (!activeTrip) {
                    alert('Trip not found or unauthorized.');
                    window.location.href = 'profile.html';
                    return;
                }
                
                // Hide save buttons since it's already saved
                document.querySelector('.budget-panel .btn-primary').style.display = 'none';
                document.querySelector('.budget-panel .btn-outline').style.display = 'none';
                
            } else {
                activeTrip = DAL.getActiveDraft();
                if (!activeTrip) {
                    window.location.href = 'create_trip.html';
                    return;
                }
            }

            document.getElementById('display-name').innerText = activeTrip.name;
            document.getElementById('display-desc').innerText = activeTrip.desc || 'No description provided.';
            
            if (window.CITIES_PROMISE) {
                await window.CITIES_PROMISE;
            }
            renderData();
        }

        function renderData() {
            let totalBudget = 0;
            const journeyHtml = [];
            const detailsHtml = [];

            activeTrip.stops.forEach((stop, i) => {
                const cityData = Helpers.getCityData(stop.city);
                const costIndex = cityData ? (cityData.cost_index || cityData.dailyCost || 0) : 0;
                const cost = costIndex * stop.duration;
                totalBudget += cost + 500; // Add flat 500 for flights per stop for mock

                journeyHtml.push(`
                    <div class="journey-node">
                        <div class="node-dot" style="background-image: url('${cityData ? (cityData.cover_photo || cityData.image) : ''}')"></div>
                        <strong>${Helpers.escapeHTML(stop.city)}</strong>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${stop.duration} Days</span>
                    </div>
                `);

                detailsHtml.push(`
                    <div style="border-left: 2px dashed var(--glass-border); padding-left: 1.5rem; position: relative;">
                        <i data-lucide="map-pin" style="position: absolute; left: -13px; top: 0; color: var(--primary); background: var(--bg-dark);"></i>
                        <h4>${Helpers.escapeHTML(stop.city)}</h4>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">${stop.start} to ${stop.end}</p>
                        <p style="margin-top: 0.5rem;">Estimated local cost: <strong>$${cost}</strong></p>
                    </div>
                `);
            });

            document.getElementById('journey-line').innerHTML = journeyHtml.join('');
            document.getElementById('route-details').innerHTML = detailsHtml.join('');
            document.getElementById('total-budget').innerText = `$${totalBudget.toLocaleString()}`;
            lucide.createIcons();
            
            // store budget for saving
            if (!isViewMode) {
                activeTrip.totalBudget = totalBudget;
                DAL.saveActiveDraft(activeTrip);
            }
        }

        init();

        window.saveToProfile = async () => {
            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            const res = await DAL.saveActiveTripToDB(activeTrip);
            
            if (res && res.success) {
                DAL.clearActiveDraft(); 
                alert('Journey Saved to your Profile Database!');
                window.location.href = 'profile.html';
            } else {
                alert('Error saving journey.');
                btn.innerHTML = 'Save Journey';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
